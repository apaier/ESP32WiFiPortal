name=ESP32WiFiPortal
version=0.2.0
author=Andrew Paier
maintainer=Andrew Paier <andrew@ultimuttsoftware.com>
sentence=ESP32 WiFi configuration portal with built-in web server.
paragraph=A reusable foundation for ESP32 projects that need a WiFi setup web UI. On boot the device loads saved credentials from NVS (via the Preferences API) and tries to join the network; if that fails it starts an open Access Point and serves a configuration form so the user can pick a network and submit credentials. The config-form HTML is compiled into the firmware at build time from files under data/. The underlying WebServer is exposed so consumers can register additional handlers for their own pages.
category=Communication
url=https://github.com/apaier/ESP32WiFiPortal
architectures=esp32
includes=ESP32WiFiPortal.h
