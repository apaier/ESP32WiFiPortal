name=ESP32WiFiPortal
version=0.1.0
author=Andrew Paier
maintainer=Andrew Paier <andrew@ultimuttsoftware.com>
sentence=ESP32 WiFi configuration portal with built-in web server and LittleFS.
paragraph=A reusable foundation for ESP32 projects that need a WiFi setup web UI. On boot the device loads saved credentials from LittleFS and tries to join the network; if that fails it starts an open Access Point and serves a configuration form so the user can pick a network and submit credentials. The underlying WebServer is exposed so consumers can register additional handlers for their own pages.
category=Communication
url=https://github.com/apaier/ESP32WiFiPortal
architectures=esp32
includes=ESP32WiFiPortal.h
depends=ArduinoJson
