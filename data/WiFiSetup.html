<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Setup</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;padding:.5rem;text-align:center}form{display:flex;flex-direction:column;gap:.5rem;align-items:center;width:100%;max-width:300px;margin:0 auto}h1{font-size:1.5rem;margin:.5rem 0}p{font-size:.9rem;margin:.3rem 0}label{display:block;font-weight:500;margin-top:.3rem;text-align:left}select,input[type=text],input[type=password]{width:100%;padding:.5rem;font-size:1rem;border:1px solid #ccc;border-radius:3px}.mode label{font-weight:normal;display:block;margin:.15rem 0}.mode input{width:auto;margin-right:.4rem}input[type=submit]{width:100%;padding:.5rem;font-size:1rem;background:#4CAF50;color:white;border:none;border-radius:3px;cursor:pointer;font-weight:bold;transition:background .3s}input[type=submit]:hover{background:#45a049}a{color:#4CAF50;text-decoration:none}@media(max-width:480px){h1{font-size:1.2rem}p{font-size:.85rem}select,input[type=text],input[type=password],input[type=submit]{padding:.4rem;font-size:.95rem}}</style>
</head>
<body>
<h1>WiFi Setup</h1>
<p>Choose a network to connect this device to.</p>
<p><a href=".">Reload</a></p>
<p>***Connection Status***</p>
<form action="wifi" method="get">
<label for="network">Network:</label>
<select name="network" id="network"><option>--Select Network--</option>***options***</select>
<label for="password">Password:</label>
<input name="password" id="password" type="text" placeholder="WiFi password">
<label>Mode:</label>
<div class="mode">
<label><input type="radio" name="mode" value="client" ***client_checked***>Client (this device only)</label>
<label><input type="radio" name="mode" value="repeater" ***repeater_checked***>Repeater (share WiFi with other devices)</label>
</div>
<input type="submit" value="Connect">
</form>
</body>
</html>
