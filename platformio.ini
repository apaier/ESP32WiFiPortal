; PlatformIO config for developing the ESP32WiFiPortal library itself.
;
; It compiles the BasicConfigPortal example using the library sources in
; src/ so you can build, flash, and exercise the library without a
; separate consumer project. Consumers of the library do NOT need this
; file; they pull the library into their own platformio.ini via:
;
;   lib_deps = https://github.com/apaier/ESP32WiFiPortal.git
;
; PlatformIO discovers this directory as a library (via library.json)
; and links it into the build automatically.

[platformio]
name = ESP32WiFiPortal (dev)
src_dir = examples/BasicConfigPortal
; Plain `pio run -t upload` uses USB; OTA needs -e esp32dev_ota.
default_envs = esp32dev
; Local, git-ignored overrides for [secrets] below. Copy
; secrets.ini.example to secrets.ini and set your own OTA password.
extra_configs = secrets.ini

; Defaults so the project still builds without secrets.ini. An empty
; ota_password compiles the example with OTA disabled.
[secrets]
ota_password =
ota_host = esp32-portal.local

[env:esp32dev]
; Using the pioarduino fork to get Arduino-ESP32 3.x on ESP-IDF v5.x.
; The official platformio/platform-espressif32 still ships Arduino-ESP32
; 2.0.17 / IDF v4.4.7, which lacks ESP_NETIF_CAPTIVEPORTAL_URI (DHCP
; option 114 / RFC 7710) needed for reliable iOS captive-portal detection.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps =
    symlink://.
build_flags =
    -DCORE_DEBUG_LEVEL=5
    '-DOTA_PASSWORD="${secrets.ota_password}"'
    ; Uncomment on boards with a battery voltage divider (see README):
    ; -DESP32WIFIPORTAL_BATTERY

; Same firmware, flashed over WiFi instead of USB:
;   pio run -e esp32dev_ota -t upload
; The board must already be running an OTA-enabled build (flash
; esp32dev over USB once) and be reachable as ota_host.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags =
    --auth=${secrets.ota_password}

; front-ext board: battery monitor wired (100k/15k on GPIO34, 4S Li-ion).
;   pio run -e front_ota -t upload
[env:front_ota]
extends = env:esp32dev_ota
upload_port = front-ext.local
build_flags =
    ${env:esp32dev.build_flags}
    -DESP32WIFIPORTAL_BATTERY
