; PlatformIO config for developing the ESP32WiFiPortal library itself.
;
; It compiles the BasicConfigPortal example using the library sources in
; src/ so you can build, flash, and exercise the library without a
; separate consumer project. Consumers of the library do NOT need this
; file; they pull the library into their own platformio.ini via:
;
;   lib_deps = https://github.com/apaier/ESP32WiFiPortal.git
;
; PlatformIO discovers this directory as a library (via library.json)
; and links it into the build automatically.

[platformio]
name = ESP32WiFiPortal (dev)
src_dir = examples/BasicConfigPortal

[env:esp32dev]
; Using the pioarduino fork to get Arduino-ESP32 3.x on ESP-IDF v5.x.
; The official platformio/platform-espressif32 still ships Arduino-ESP32
; 2.0.17 / IDF v4.4.7, which lacks ESP_NETIF_CAPTIVEPORTAL_URI (DHCP
; option 114 / RFC 7710) needed for reliable iOS captive-portal detection.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps =
    symlink://.
build_flags =
    -DCORE_DEBUG_LEVEL=5
